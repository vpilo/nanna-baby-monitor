name: Build environment setup
description: Installs Android SDK and sets up Gradle caching. JDK is already resolved via Gradle by foojay.

runs:
  using: composite
  steps:
    # Already present on the x86_64 hosted runners, this only installs on the arm ones.
    - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      with:
        packages: platforms;android-37.2 build-tools;37.0.0
        log-accepted-android-sdk-licenses: false

    - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      with:
        # Only the default branch and tags refresh the cache, everything else reuses it.
        cache-read-only: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) && !startsWith(github.ref, 'refs/tags/') }}
