name: Build Android

on:
  workflow_call:
    inputs:
      release:
        description: Build a signed release APK/AAB instead of debug APK/no AAB.
        type: boolean
        default: false
    secrets:
      BABY_MONITOR_KEYSTORE_BASE64:
        required: false
      BABY_MONITOR_KEYSTORE_PASSWORD:
        required: false

jobs:
  build:
    name: ${{ inputs.release && 'release' || 'debug' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Build debug APK
        if: ${{ !inputs.release }}
        run: |
          ./gradlew :appAndroid:assembleDebug :appAndroid:generateVersionFile
          mv appAndroid/build/outputs/apk/*/*.apk .
          mv appAndroid/build/outputs/version.txt .

      - name: Set up release keystore
        if: ${{ inputs.release }}
        env:
          KEYSTORE_BASE64: ${{ secrets.BABY_MONITOR_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "BABY_MONITOR_KEYSTORE_BASE64 is not set!"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > appAndroid/release/babymonitor.jks

      - name: Build release APK and AAB
        if: ${{ inputs.release }}
        env:
          BABY_MONITOR_KEYSTORE_PASSWORD: ${{ secrets.BABY_MONITOR_KEYSTORE_PASSWORD }}
        run: |
          test -n "$BABY_MONITOR_KEYSTORE_PASSWORD" || { echo "BABY_MONITOR_KEYSTORE_PASSWORD is not set!"; exit 1; }
          ./gradlew :appAndroid:assembleRelease :appAndroid:bundleRelease :appAndroid:generateVersionFile -Pbabymonitor.release=true
          mv appAndroid/build/outputs/apk/*/*.apk .
          mv appAndroid/build/outputs/bundle/*/*.aab .
          mv appAndroid/build/outputs/mapping/release/mapping.txt "./mapping-${GITHUB_REF_NAME}.txt"
          mv appAndroid/build/outputs/version.txt .

      - name: Remove release keystore
        if: ${{ always() && inputs.release }}
        run: rm -f appAndroid/release/babymonitor.jks

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: android-${{ inputs.release && 'release' || 'debug' }}
          path: |
            ./*.apk
            ./*.aab
            ./mapping-*.txt
            ./version.txt
          if-no-files-found: error
          retention-days: ${{ inputs.release && 90 || 14 }}
