workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      variables:
        CACHE_POLICY: "pull"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG
      variables:
        CACHE_POLICY: "pull-push"

stages:
  - build
  - release

variables:
  GIT_DEPTH: "0"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-home"
  GRADLE_OPTS: "-Dorg.gradle.java.installations.auto-detect=true"

.gradle-cache-paths: &gradle-cache-paths
  - .gradle-home/caches/modules-*/
  - .gradle-home/caches/build-cache-*/
  - .gradle-home/caches/transforms-*/
  - .gradle-home/caches/jars-*/
  - .gradle-home/wrapper/

.environment:
  image: ghcr.io/cirruslabs/android-sdk:36 # Image must support both arm&x86.
  stage: build
  interruptible: true
  artifacts:
    name: "babymonitor-$CI_COMMIT_SHORT_SHA-$CI_JOB_NAME_SLUG"
    expire_in: 1 week
    when: always
  before_script:
    - VERSION="$(git describe --tags --always)"
  cache:
    - key: "gradle-$CACHE_NAME"
      paths: *gradle-cache-paths
      policy: $CACHE_POLICY

.release-build:
  extends: .environment
  timeout: 30m
  rules:
    - if: $CI_COMMIT_TAG
  artifacts:
    name: "babymonitor-$CI_COMMIT_REF_SLUG-$CI_JOB_NAME_SLUG"
    expire_in: never
    when: on_success

build:root:
  extends: .environment
  tags:
    - saas-linux-medium-amd64
  variables:
    CACHE_NAME: "root"
  script:
    - ./gradlew ktlintCheck detekt
    - ./gradlew test
  artifacts:
    reports:
      junit:
        - "**/build/test-results/**/TEST-*.xml"

build:android:
  extends: .environment
  tags:
    - saas-linux-medium-amd64
  variables:
    CACHE_NAME: "android"
  needs:
    - job: build:root
      artifacts: false
  script:
    - ./gradlew :appAndroid:assembleDebug
    - mv appAndroid/build/outputs/apk/*/*.apk .
  artifacts:
    paths:
      - ./*.apk

build:linux-x86_64:
  extends: .environment
  tags:
    - saas-linux-medium-amd64
  variables:
    CACHE_NAME: "linux-x86_64"
  needs:
    - job: build:root
      artifacts: false
  script:
    - ./gradlew -Pjavacpp.platform=linux-x86_64 :appDesktop:packageUberJarForCurrentOS
    - mv appDesktop/build/compose/jars/*.jar .
  artifacts:
    paths:
      - ./*.jar

build:linux-arm64:
  extends: .environment
  tags:
    - saas-linux-small-arm64
  variables:
    CACHE_NAME: "linux-arm64"
  needs:
    - job: build:root
      artifacts: false
  script:
    - ./gradlew -Pjavacpp.platform=linux-arm64 :appDesktop:packageUberJarForCurrentOS
    - mv appDesktop/build/compose/jars/*.jar .
  artifacts:
    paths:
      - ./*.jar

release:android:
  extends: .release-build
  tags:
    - saas-linux-medium-amd64
  variables:
    CACHE_NAME: "android"
    GLAB_VERSION: "1.114.0"
    RELEASE_KEYSTORE_FILE: "$CI_PROJECT_DIR/.secure_files/babymonitor.jks"
  needs:
    - job: build:android
      artifacts: false
  script:
    - test -n "$RELEASE_KEYSTORE_PASSWORD" || { echo "RELEASE_KEYSTORE_PASSWORD is not set!"; exit 1; }
    - curl --silent --show-error --fail --location --output glab.tar.gz "https://gitlab.com/gitlab-org/cli/-/releases/v${GLAB_VERSION}/downloads/glab_${GLAB_VERSION}_linux_amd64.tar.gz"
    - tar -xzf glab.tar.gz -C /usr/local bin/glab && rm glab.tar.gz
    - glab auth login --job-token "$CI_JOB_TOKEN" --hostname "$CI_SERVER_FQDN" --api-protocol "$CI_SERVER_PROTOCOL"
    - glab -R "$CI_PROJECT_PATH" securefile download --all --output-dir "$CI_PROJECT_DIR/.secure_files"
    - ./gradlew :appAndroid:assembleRelease :appAndroid:generateVersionFile -Pbabymonitor.release=true
    - mv appAndroid/build/outputs/apk/*/*.apk .
    - mv appAndroid/build/outputs/mapping/release/mapping.txt ./mapping-$VERSION.txt
    - mv appAndroid/build/outputs/version.txt .
  artifacts:
    paths:
      - ./*.apk
      - ./mapping-*.txt
      - ./version.txt

release:linux-x86_64:
  extends: .release-build
  tags:
    - saas-linux-medium-amd64
  variables:
    CACHE_NAME: "linux-x86_64"
  needs:
    - job: build:linux-x86_64
      artifacts: false
  script:
    - ./gradlew -Pjavacpp.platform=linux-x86_64 :appDesktop:packageReleaseUberJarForCurrentOS -Pbabymonitor.release=true
    - mv appDesktop/build/compose/jars/*.jar .
  artifacts:
    paths:
      - ./*.jar

release:linux-arm64:
  extends: .release-build
  tags:
    - saas-linux-small-arm64
  variables:
    CACHE_NAME: "linux-arm64"
  needs:
    - job: build:linux-arm64
      artifacts: false
  script:
    - ./gradlew -Pjavacpp.platform=linux-arm64 :appDesktop:packageReleaseUberJarForCurrentOS -Pbabymonitor.release=true
    - mv appDesktop/build/compose/jars/*.jar .
  artifacts:
    paths:
      - ./*.jar

release:gitlab:
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  stage: release
  interruptible: false
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - job: release:android
      artifacts: false
    - job: release:linux-x86_64
      artifacts: false
    - job: release:linux-arm64
      artifacts: false
  script:
    - echo "${CI_COMMIT_TAG_MESSAGE:-Nanna Baby Monitor $CI_COMMIT_TAG}" > release-notes.md
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "Nanna Baby Monitor $CI_COMMIT_TAG"
    description: release-notes.md
    assets:
      links:
        - name: "Android APK"
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/download?job=release:android"
          link_type: package
        - name: "Desktop jar (linux-x86_64)"
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/download?job=release:linux-x86_64"
          link_type: package
        - name: "Desktop jar (linux-arm64)"
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/download?job=release:linux-arm64"
          link_type: package
        # filepath publishes it under /-/releases/permalink/latest/downloads/version.txt
        - name: "Version information"
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/version.txt?job=release:android"
          link_type: other
          filepath: /version.txt
